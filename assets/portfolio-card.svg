<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 120" shape-rendering="crispEdges">
  <defs>
    <g id="corner">
      <!-- top vine -->
      <g fill="#2FB574">
        <rect x="30" y="18" width="6" height="6"/><rect x="36" y="18" width="6" height="6"/>
        <rect x="42" y="24" width="6" height="6"/><rect x="48" y="24" width="6" height="6"/>
        <rect x="54" y="18" width="6" height="6"/><rect x="60" y="18" width="6" height="6"/>
        <rect x="66" y="24" width="6" height="6"/><rect x="72" y="24" width="6" height="6"/>
        <rect x="78" y="18" width="6" height="6"/><rect x="84" y="18" width="6" height="6"/>
      </g>
      <!-- left vine -->
      <g fill="#2FB574">
        <rect x="18" y="30" width="6" height="6"/><rect x="18" y="36" width="6" height="6"/>
        <rect x="24" y="42" width="6" height="6"/><rect x="24" y="48" width="6" height="6"/>
        <rect x="18" y="54" width="6" height="6"/><rect x="18" y="60" width="6" height="6"/>
        <rect x="24" y="66" width="6" height="6"/><rect x="24" y="72" width="6" height="6"/>
        <rect x="18" y="78" width="6" height="6"/><rect x="18" y="84" width="6" height="6"/>
      </g>
      <!-- leaves -->
      <g fill="#7EE0A4">
        <rect x="42" y="30" width="6" height="6"/><rect x="54" y="12" width="6" height="6"/>
        <rect x="66" y="30" width="6" height="6"/><rect x="78" y="12" width="6" height="6"/>
        <rect x="30" y="42" width="6" height="6"/><rect x="12" y="54" width="6" height="6"/>
        <rect x="30" y="66" width="6" height="6"/><rect x="12" y="78" width="6" height="6"/>
      </g>
      <!-- pink flower -->
      <g fill="#D946B8">
        <rect x="18" y="12" width="6" height="6"/><rect x="12" y="18" width="6" height="6"/>
        <rect x="24" y="18" width="6" height="6"/><rect x="18" y="24" width="6" height="6"/>
      </g>
      <rect x="18" y="18" width="6" height="6" fill="#FFE3F6"/>
    </g>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="699" height="119" fill="#14081F" stroke="#4A2380" stroke-dasharray="6 6"/>

  <!-- four corners -->
  <use href="#corner"/>
  <use href="#corner" transform="translate(700,0) scale(-1,1)"/>
  <use href="#corner" transform="translate(0,120) scale(1,-1)"/>
  <use href="#corner" transform="translate(700,120) scale(-1,-1)"/>

  <!-- text -->
  <text x="350" y="54" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" font-weight="bold" letter-spacing="2" fill="#FF7AD9">▶ ENTER THE FULL PORTFOLIO</text>
  <text x="350" y="80" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#7EE0A4">anannya-salvi.vercel.app</text>
  <rect x="442" y="70" width="7" height="12" fill="#D946B8">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
</svg>
